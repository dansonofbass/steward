<text x="440.0" y="401" font-size="14.5" font-weight="600" fill="#EEF1EC" text-anchor="middle">The answer comes back in aliases. Steward puts the real names back.</text>
<text x="440.0" y="426" font-size="12.5" font-weight="400" fill="#B8C3C9" text-anchor="middle">Steward never connects to Claude; only your gateway does. A local model there also looks for names Steward doesn't hold, and can miss one.</text>
