<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What leaves your machine when you ask Steward a question</title>
<desc id="desc">Steward sends your question through your own gateway. Account and payee names become aliases such as Account 1 and Payee 4, notes and account numbers stay on your machine, and figures such as spending by category go through. The answer comes back in aliases and Steward puts the real names back on your screen.</desc>
